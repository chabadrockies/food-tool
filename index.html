<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Internal food order entry tool">
	<title>Chabad Food | Order Entry</title>
	<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
	<link rel="stylesheet" href="styles.css"> </head>

<body>
  <main class="app-shell">
    <header class="date-manager w3-card-2 w3-round-large w3-white" aria-label="Order dates">
      <div class="date-manager-heading w3-bar">
        <div class="w3-bar-item"><p class="eyebrow">Food orders</p><h1>Order dates</h1></div>
        <button id="new-date" class="w3-button new-button" type="button">+ New date</button>
      </div>
      <div id="date-list" class="date-list w3-row-padding" aria-label="Current order dates"></div>
      <label class="active-delivery-control" for="active-delivery"><span id="active-delivery-label">Delivery for selected date</span><select id="active-delivery" class="w3-select w3-border"></select></label>
      <input id="date-picker" class="date-picker" type="date" aria-label="Choose order date" tabindex="-1">
    </header>

    <div class="app-layout">
      <section class="menu-area" aria-label="Menu">
        <p id="active-date-message" class="date-title"></p>
        <div id="menu"></div>
      </section>

      <aside class="totals-panel w3-white w3-card-2" aria-labelledby="totals-heading">
        <div class="totals-heading"><h1 id="totals-heading">Totals by date</h1><button id="export-invoice" class="w3-button export-button" type="button">Export invoice</button></div>
        <div id="totals-content" class="totals-content"><div id="date-totals"></div></div>
        <div class="totals-footer"><div class="all-totals"><div><span>Food subtotal</span><span class="total-caption">No delivery</span></div><strong id="food-subtotal">$0</strong></div><div class="grand-total"><span>All dates total</span><span id="grand-total">$0</span></div></div>
      </aside>
    </div>
  </main>
  <div id="invoice-modal" class="invoice-modal" role="dialog" aria-modal="true" aria-labelledby="invoice-title" hidden>
    <div class="invoice-dialog">
      <div class="invoice-actions"><button id="delivery-toggle" class="w3-button format-button" type="button">Show Delivery</button><button id="format-toggle" class="w3-button format-button" type="button">Whatsapp Mode</button><button id="copy-invoice" class="w3-button copy-button" type="button">Copy invoice</button><button id="close-invoice" class="w3-button close-button" type="button" aria-label="Close invoice">&times;</button></div>
      <div id="invoice-content" class="invoice-content" contenteditable="true"></div>
      <p id="copy-status" class="copy-status" aria-live="polite"></p>
    </div>
  </div>
  <div id="start-date-modal" class="w3-modal start-modal" role="dialog" aria-modal="true" aria-labelledby="start-date-title" hidden>
    <div class="w3-modal-content w3-card-4 w3-animate-top start-date-dialog">
      <div class="w3-container">
        <h2 id="start-date-title">Start a food order</h2>
        <p>Choose the first date you want to create an order for.</p>
        <form id="start-date-form">
          <label for="start-date">Order date</label>
          <input id="start-date" class="w3-input w3-border w3-round" type="date" required>
          <button class="w3-button w3-green w3-round-large start-date-button" type="submit">Start order</button>
        </form>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>

</html>
